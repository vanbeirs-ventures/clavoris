<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Us — Clavoris</title>
<link rel="icon" href="assets/clavoris-mark.png">
<link rel="stylesheet" href="clavoris.css">
</head>
<body data-page="about">

  <main data-screen-label="About Us">
    <!-- HERO -->
    <section class="page-hero" data-screen-label="About hero">
      <div class="wrap">
        <div class="lead-rule" data-reveal><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_eyebrow"></span></div>
        <h1 class="page-title" data-i18n="ab_title" data-reveal></h1>
        <p class="page-lede" data-i18n="ab_lede" data-reveal></p>
      </div>
    </section>

    <!-- THE NAME -->
    <section class="section" data-screen-label="The name">
      <div class="wrap">
        <div class="split">
          <div data-reveal>
            <div class="lead-rule" style="margin-bottom:18px"><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_name_eyebrow"></span></div>
            <blockquote class="pull" data-i18n="ab_name_pull"></blockquote>
          </div>
          <div class="prose" data-reveal>
            <p data-i18n="ab_name_p1"></p>
            <p data-i18n="ab_name_p2"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- WHAT CLAVORIS IS -->
    <section class="section alt" data-screen-label="What Clavoris is">
      <div class="wrap">
        <div class="split">
          <div data-reveal>
            <div class="lead-rule" style="margin-bottom:14px"><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_what_eyebrow"></span></div>
            <h2 class="section-title" data-i18n="ab_what_title"></h2>
          </div>
          <div class="prose" data-reveal>
            <p data-i18n="ab_what_p1"></p>
            <p data-i18n="ab_what_p2"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- BUILT ON CANTON -->
    <section class="authority-band" data-screen-label="Built on Canton">
      <div class="wrap">
        <div class="lead-rule" data-reveal><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_canton_eyebrow"></span></div>
        <blockquote class="authority-pull" data-i18n="ab_canton_pull" data-reveal></blockquote>
        <p class="authority-body" data-i18n="ab_canton_p1" data-reveal></p>
      </div>
    </section>

    <!-- PRINCIPLES -->
    <section class="section" data-screen-label="Principles">
      <div class="wrap">
        <div class="section-head" data-reveal>
          <div class="lead-rule"><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_pr_eyebrow"></span></div>
          <h2 class="section-title" data-i18n="ab_pr_title"></h2>
        </div>
        <div class="grid cols-3">
          <div class="card" data-reveal>
            <span class="latin">Privatus</span>
            <h3 class="card-title" data-i18n="ab_p1_t"></h3>
            <p class="card-body" data-i18n="ab_p1_b"></p>
          </div>
          <div class="card" data-reveal>
            <span class="latin">Fides</span>
            <h3 class="card-title" data-i18n="ab_p2_t"></h3>
            <p class="card-body" data-i18n="ab_p2_b"></p>
          </div>
          <div class="card" data-reveal>
            <span class="latin">Clavis</span>
            <h3 class="card-title" data-i18n="ab_p3_t"></h3>
            <p class="card-body" data-i18n="ab_p3_b"></p>
          </div>
          <div class="card" data-reveal>
            <span class="latin">Exactitudo</span>
            <h3 class="card-title" data-i18n="ab_p4_t"></h3>
            <p class="card-body" data-i18n="ab_p4_b"></p>
          </div>
          <div class="card" data-reveal>
            <span class="latin">Perpetuitas</span>
            <h3 class="card-title" data-i18n="ab_p5_t"></h3>
            <p class="card-body" data-i18n="ab_p5_b"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- WHO CLAVORIS SERVES -->
    <section class="section alt" data-screen-label="Who Clavoris serves">
      <div class="wrap">
        <div class="section-head" data-reveal>
          <div class="lead-rule"><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_serve_eyebrow"></span></div>
          <h2 class="section-title" data-i18n="ab_serve_title"></h2>
        </div>
        <div class="grid cols-3">
          <div class="card" data-reveal>
            <span class="card-num">01</span>
            <h3 class="card-title" data-i18n="ab_s1_t"></h3>
            <p class="card-body" data-i18n="ab_s1_b"></p>
          </div>
          <div class="card" data-reveal>
            <span class="card-num">02</span>
            <h3 class="card-title" data-i18n="ab_s2_t"></h3>
            <p class="card-body" data-i18n="ab_s2_b"></p>
          </div>
          <div class="card" data-reveal>
            <span class="card-num">03</span>
            <h3 class="card-title" data-i18n="ab_s3_t"></h3>
            <p class="card-body" data-i18n="ab_s3_b"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- THE PLATFORM BEHIND THE PLATFORM -->
    <section class="section" data-screen-label="Platform behind">
      <div class="wrap">
        <div class="split">
          <div data-reveal>
            <div class="lead-rule" style="margin-bottom:14px"><hr class="gold-rule"><span class="eyebrow" data-i18n="ab_plat_eyebrow"></span></div>
            <div class="footer-loc" style="color:var(--slate);margin-top:18px" data-i18n="loc"></div>
          </div>
          <div class="prose" data-reveal>
            <p data-i18n="ab_plat_p1"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta-band" data-screen-label="About CTA">
      <div class="wrap">
        <div class="cta-inner" data-reveal>
          <h2 class="ct-title" data-i18n="home_cta_t"></h2>
          <a class="btn btn-navy" href="login.html"><span data-i18n="cta_access"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#1A3A5C"/>
      <circle cx="50" cy="42" r="20" fill="none" stroke="#F7F3EC" stroke-width="3"/>
      <circle cx="50" cy="38" r="7" fill="none" stroke="#F7F3EC" stroke-width="3"/>
      <circle cx="50" cy="38" r="2.6" fill="#B8860B"/>
      <path d="M50 45v14M50 55h6" stroke="#F7F3EC" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#F7F3EC">Clavori<tspan fill="#B8860B" font-style="italic">s</tspan></text>
    </svg>
  </template>

  <script src="i18n.js"></script>
  <script src="i18n2.js"></script>
  <script src="i18n-legal.js"></script>
  <script src="i18n-about.js"></script>
  <script src="site.js"></script>
</body>
</html>
