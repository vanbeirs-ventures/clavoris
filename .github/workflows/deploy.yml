name: Deploy to Bunny CDN

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  STORAGE_ZONE_ID: "1987436"
  STORAGE_ZONE_NAME: "clavoris"
  PULLZONE_ID: "6793540"

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site files to Bunny Storage
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          SK=$(curl -fsS -H "AccessKey: $BUNNY_API_KEY" "https://api.bunny.net/storagezone/$STORAGE_ZONE_ID" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Password"])')
          COUNT=0
          while IFS= read -r -d '' f; do
            p="${f#./}"
            case "$p" in
              .git/*|.github/*|README.md|supabase/*|design/*) continue ;;
            esac
            echo "PUT $p"
            curl -fsS -X PUT -H "AccessKey: $SK" --data-binary "@$f" \
              "https://storage.bunnycdn.com/$STORAGE_ZONE_NAME/$p" > /dev/null
            COUNT=$((COUNT+1))
          done < <(find . -type f -print0)
          echo "Uploaded $COUNT files"

      - name: Edge rule — browsers must revalidate HTML pages
        # The pull zone sends Cache-Control max-age=30d on everything; fine for app.css/js (versioned
        # ?v= tags) but HTML pages would then survive a deploy for a month in the visitor's browser.
        # Looked up by description so re-runs update the same rule. ActionType 16 = OverrideBrowserCacheTime (0 s).
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key, zone = os.environ["BUNNY_API_KEY"], os.environ["PULLZONE_ID"]
          desc = "HTML: no browser cache (deploys visible immediately)"
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.bunny.net" + path, method=method, data=json.dumps(body).encode() if body is not None else None,
                                           headers={"AccessKey": key, "content-type": "application/json", "accept": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()
          st, txt = call("GET", f"/pullzone/{zone}")
          rules = json.loads(txt).get("EdgeRules", []) if st == 200 else []
          guid = next((r.get("Guid") for r in rules if r.get("Description") == desc), None)
          rule = {"ActionType": 16, "ActionParameter1": "0", "ActionParameter2": "", "Enabled": True, "Description": desc, "TriggerMatchingType": 0,
                  "Triggers": [{"Type": 0, "PatternMatchingType": 0, "PatternMatches": ["*.html", "*/", "https://www.clavoris.com", "https://www.clavoris.com/app", "https://clavoris.com"], "Parameter1": ""}]}
          if guid: rule["Guid"] = guid
          st, txt = call("POST", f"/pullzone/{zone}/edgerules/addOrUpdate", rule)
          print("Edge rule:", "updated" if guid else "created", st, txt[:300])
          if st not in (200, 201, 204): print(f"::warning::edge rule not applied: HTTP {st} {txt[:400]}")
          PY

      - name: Purge CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl -fsS -X POST -H "AccessKey: $BUNNY_API_KEY" "https://api.bunny.net/pullzone/$PULLZONE_ID/purgeCache"
          echo 'Cache purged.'
