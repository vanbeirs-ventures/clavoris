name: Deploy to Bunny CDN

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  STORAGE_ZONE_ID: "1987436"
  STORAGE_ZONE_NAME: "clavoris"
  PULLZONE_ID: "6793540"

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust script and stylesheet URLs with the commit
        # Every page references its scripts/stylesheets as "file.js?v=<version>". The version is
        # rewritten to the commit SHA at deploy time, so each deploy gets fresh URLs and no browser can
        # keep running an old clavoris-access.js / i18n dictionary against a new page (i18n.js passes
        # the same ?v= on to the dictionaries it loads).
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::10}"
          grep -rlE '\?v=[0-9a-z]+' --include='*.html' . | grep -v '^./.git/' | while read -r f; do
            sed -i -E "s/\?v=[0-9a-z]+/?v=$V/g" "$f"
          done
          echo "Asset version: $V"

      - name: Upload site files to Bunny Storage
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          SK=$(curl -fsS -H "AccessKey: $BUNNY_API_KEY" "https://api.bunny.net/storagezone/$STORAGE_ZONE_ID" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Password"])')
          COUNT=0
          while IFS= read -r -d '' f; do
            p="${f#./}"
            case "$p" in
              .git/*|.github/*|README.md|supabase/*|design/*) continue ;;
            esac
            echo "PUT $p"
            curl -fsS -X PUT -H "AccessKey: $SK" --data-binary "@$f" \
              "https://storage.bunnycdn.com/$STORAGE_ZONE_NAME/$p" > /dev/null
            COUNT=$((COUNT+1))
          done < <(find . -type f -print0)
          echo "Uploaded $COUNT files"

      - name: Edge rules — browsers must revalidate HTML pages and the app's CSS/JS
        # The pull zone sends Cache-Control max-age=30d on everything. Pages, stylesheets and scripts must
        # instead be revalidated on every load (cheap 304s), otherwise a visitor's browser keeps a deployed
        # version for a month. Rules are looked up by description so re-runs update the same rules.
        # ActionType 16 = OverrideBrowserCacheTime (0 s). Images/fonts keep the long browser cache.
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key, zone = os.environ["BUNNY_API_KEY"], os.environ["PULLZONE_ID"]
          RULES = [
              ("HTML: no browser cache (deploys visible immediately)", ["*.html", "*.html?*", "*/", "https://www.clavoris.com", "https://www.clavoris.com/app"]),
              ("CSS/JS: no browser cache (deploys visible immediately)", ["*.css", "*.js", "*.css?*", "*.js?*"]),
          ]
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.bunny.net" + path, method=method, data=json.dumps(body).encode() if body is not None else None,
                                           headers={"AccessKey": key, "content-type": "application/json", "accept": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()
          st, txt = call("GET", f"/pullzone/{zone}")
          rules = json.loads(txt).get("EdgeRules", []) if st == 200 else []
          # Transitional (October 2026): pages loaded earlier were cached by browsers for 30 days together with
          # their scripts; one fresh page load now clears that browser cache (Clear-Site-Data: cache), so no
          # visitor keeps running an old script against new pages.
          # DISABLED 15 Oct 2026: Chrome on Android blocks the page (blank for minutes) while it clears the cache;
          # no longer needed since HTML/CSS/JS are never browser-cached and scripts carry ?v= versions.
          HEADERS = [
              ("HTML: clear stale browser cache (transitional)", ["*.html", "*.html?*", "*/", "https://www.clavoris.com", "https://www.clavoris.com/app"], "Clear-Site-Data", "\"cache\"", False),
          ]
          for desc, patterns in RULES:
              guid = next((r.get("Guid") for r in rules if r.get("Description") == desc), None)
              rule = {"ActionType": 16, "ActionParameter1": "0", "ActionParameter2": "", "Enabled": True, "Description": desc, "TriggerMatchingType": 0,
                      "Triggers": [{"Type": 0, "PatternMatchingType": 0, "PatternMatches": patterns, "Parameter1": ""}]}
              if guid: rule["Guid"] = guid
              st, txt = call("POST", f"/pullzone/{zone}/edgerules/addOrUpdate", rule)
              print("Edge rule:", desc, "updated" if guid else "created", st, txt[:200])
              if st not in (200, 201, 204): print(f"::warning::edge rule not applied: HTTP {st} {txt[:400]}")
          for desc, patterns, hname, hval, enabled in HEADERS:
              guid = next((r.get("Guid") for r in rules if r.get("Description") == desc), None)
              rule = {"ActionType": 5, "ActionParameter1": hname, "ActionParameter2": hval, "Enabled": enabled, "Description": desc, "TriggerMatchingType": 0,
                      "Triggers": [{"Type": 0, "PatternMatchingType": 0, "PatternMatches": patterns, "Parameter1": ""}]}
              if guid: rule["Guid"] = guid
              st, txt = call("POST", f"/pullzone/{zone}/edgerules/addOrUpdate", rule)
              print("Edge rule:", desc, "updated" if guid else "created", st, txt[:200])
              if st not in (200, 201, 204): print(f"::warning::edge rule not applied: HTTP {st} {txt[:400]}")
          PY

      - name: Purge CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl -fsS -X POST -H "AccessKey: $BUNNY_API_KEY" "https://api.bunny.net/pullzone/$PULLZONE_ID/purgeCache"
          echo 'Cache purged.'
