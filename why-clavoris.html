            <div><span class="v-num">01 · PRIVATUS</span><div class="v-title" data-i18n="why_v1_t"></div><p class="v-body" data-i18n="why_v1_b"></p></div>
          </div>
          <div class="value-row" data-reveal>
            <div class="v-latin">Fides</div>
            <div><span class="v-num">02 · FIDES</span><div class="v-title" data-i18n="why_v2_t"></div><p class="v-body" data-i18n="why_v2_b"></p></div>

            <div class="v-latin">Exactitudo</div>

          </div>
          <div class="value-row" data-reveal>
            <div class="v-latin">Perpetuitas</div>
            <div><span class="v-num">05 · PERPETUITAS</span><div class="v-title" data-i18n="why_v5_t"></div><p class="v-body" data-i18n="why_v5_b"></p></div>
          </div>
        </div>
      </div>
    </section>

      <div class="wrap" style="padding-top:clamp(56px,8vw,96px);padding-bottom:clamp(56px,8vw,96px)">
        <div class="metric-grid">
          <div class="metric" data-reveal><div class="m-num">T+0</div><div class="m-tag" data-i18n="home_m1_t"></div></div>
          <div class="metric" data-reveal><div class="m-num">€100K</div><div class="m-tag" data-i18n="home_m2_t"></div></div>
          <div class="metric" data-reveal><div class="m-num">€350<span class="gold">–</span>500M</div><div class="m-tag" data-i18n="home_m3_t"></div></div>
          <div class="metric" data-reveal><div class="m-num">AMLD6</div><div class="m-tag" data-i18n="home_m4_t"></div></div>

      </div>

    <!-- CTA -->
