<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Terms and Conditions — Clavoris</title>
<link rel="icon" href="assets/clavoris-mark.png">
<link rel="stylesheet" href="clavoris.css">
<style>
  .tg-notice { max-width: 800px; margin: 0 0 18px; padding: 14px 18px; border: 1px solid var(--border);
    border-left: 3px solid var(--seal-gold); border-radius: var(--r-md, 6px); background: var(--bg-raised, transparent);
    font-size: 14px; line-height: 1.65; color: var(--fg-1); }
  .tg-lbl { display: block; font-family: var(--font-data); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--fg-3, var(--fg-2)); margin-bottom: 6px; }
  .tg-lbl[hidden] { display: none; }
  .tg-bi .tg-lbl-tr { margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .tg-bi > h3, .tg-bi > p { color: var(--fg-2); }
  .tg-bi > h3 { font-size: .9em; }
  .tg-bi > p { font-size: 14.5px; }
</style>
</head>
<body data-page="terms">

  <main data-screen-label="General Terms">
    <section class="page-hero" data-screen-label="Terms hero">
      <div class="wrap">
        <div class="lead-rule" data-reveal><hr class="gold-rule"><span class="eyebrow" data-i18n="tg_eyebrow"></span></div>
        <h1 class="page-title" data-i18n="tg_title" data-reveal></h1>
        <p class="page-lede" data-i18n="tg_lede" data-reveal></p>
        <p class="page-meta" data-i18n="tg_updated" data-reveal></p>
      </div>
    </section>

    <section class="section" data-screen-label="Terms body">
      <div class="wrap">
        <div class="legal-list">
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h1"></h3><p data-i18n="tg_b1"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h2"></h3><p data-i18n="tg_b2"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h3"></h3><p data-i18n="tg_b3"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h4"></h3><p data-i18n="tg_b4"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h5"></h3><p data-i18n="tg_b5"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h6"></h3><p data-i18n="tg_b6"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h7"></h3><p data-i18n="tg_b7"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h8"></h3><p data-i18n="tg_b8"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h9"></h3><p data-i18n="tg_b9"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h10"></h3><p data-i18n="tg_b10"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h11"></h3><p data-i18n="tg_b11"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h12"></h3><p data-i18n="tg_b12"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h13"></h3><p data-i18n="tg_b13"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h14"></h3><p data-i18n="tg_b14"></p></div>
          <div class="legal-clause" data-reveal><h3 data-i18n="tg_h15"></h3><p data-i18n="tg_b15"></p></div>
        </div>
        <div class="legal-contact" data-reveal>
          <span class="eyebrow" data-i18n="legal_contact_h"></span>
          <p><span data-i18n="legal_contact"></span> <a href="mailto:info@clavoris.com">info@clavoris.com</a></p>
        </div>
      </div>
    </section>
  </main>
